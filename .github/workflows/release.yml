name: Release

run-name: ${{ inputs.version && format('Release {0}', inputs.version) || '' }}

on:
  push:
    tags: ["v*"]
  # Run by hand, from the Actions tab or with `gh workflow run`, with a version
  # it tags the latest commit of main with that version and releases it. Without
  # a version, it builds the release without publishing it, to try it from any
  # branch: the archives and packages are in the run's artifacts.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.2.3 or 1.2.3-rc.1. Empty builds the release without publishing it.
        type: string
        required: false

permissions:
  contents: write

jobs:
  # Run by hand with a version: tags the latest commit of main with it.
  tag:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # For the tags.
          fetch-depth: 0

      - name: Tag the version
        id: tag
        env:
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1.2.3 or v1.2.3, with an optional pre-release suffix such as -rc.1.
          # No number starts with 0, such as in rc.01: semver and GoReleaser
          # refuse it.
          version=$(printf '%s' "$VERSION" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
          tag="v${version#v}"
          number='(0|[1-9][0-9]*)'
          identifier="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          semver="^v$number\.$number\.$number(-$identifier(\.$identifier)*)?\$"
          if ! [[ $tag =~ $semver ]]; then
            echo "::error::\"$version\" isn't a version such as 1.2.3 or 1.2.3-rc.1."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            # Running this run again, after the release failed, releases the
            # tag its first attempt made.
            if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ] && [ "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA" ]; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$tag exists already: pick another version."
            exit 1
          fi

          # Homebrew, the AUR, NUR and install.sh take the latest release, so an
          # older version would take them back.
          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          core=${tag%%-*}
          if [ -n "$latest" ] && [ "$(printf '%s\n' "$latest" "$core" | sort -V | tail -n 1)" = "$latest" ]; then
            echo "::error::$tag doesn't come after $latest, the latest release."
            exit 1
          fi

          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases come from $DEFAULT_BRANCH: run the workflow from $DEFAULT_BRANCH, not ${GITHUB_REF#refs/heads/}."
            exit 1
          fi

          # The run releases the commit it started on. GitHub also refuses
          # this workflow's tag on an older commit once main's workflows
          # changed.
          head=$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f 1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::$DEFAULT_BRANCH changed since this run started: run the workflow again, to release its latest commit."
            exit 1
          fi

          # Fails when the tag exists, even on this commit, such as when the
          # workflow runs twice at once with this version. A tag made with the
          # workflow's GITHUB_TOKEN runs no workflow, so this doesn't run the
          # Release workflow a second time: the release job below releases
          # the tag.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    # Also when the tag job didn't run: for a pushed tag, and for a run by hand
    # without a version.
    if: ${{ !failure() && !cancelled() }}
    # The macOS build needs cgo and the macOS SDK, so the release runs on a
    # Mac. The Linux builds need no cgo, so they cross-compile on it too.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag the tag job made, or else the commit that ran the workflow.
          ref: ${{ needs.tag.outputs.tag && format('refs/tags/{0}', needs.tag.outputs.tag) || '' }}
          # The changelog needs the earlier tags.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ github.event_name == 'workflow_dispatch' && inputs.version == '' && '--snapshot' || '' }}
        env:
          # The tag to release, which GoReleaser otherwise picks among the tags
          # of the commit.
          GORELEASER_CURRENT_TAG: ${{ needs.tag.outputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the cask to spot-go/homebrew-tap and the Nix package
          # to spot-go/nur-packages.
          PACKAGES_GITHUB_TOKEN: ${{ secrets.PACKAGES_GITHUB_TOKEN }}
          # The SSH key of the AUR account that maintains spot-go-bin.
          AUR_KEY: ${{ secrets.AUR_KEY }}

      - if: github.event_name == 'workflow_dispatch' && inputs.version == ''
        uses: actions/upload-artifact@v7
        with:
          name: spot-go-snapshot
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt
            dist/homebrew/
            dist/aur/
            dist/nix/
